<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Your Answers</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <header class="top-bar">

        <div>

            <h1>📋 Your Answers</h1>

            <p>
                Review your answers before submitting.
            </p>

        </div>


        <a
            href="index.html"
            class="admin-link"
        >
            📝 Form
        </a>

    </header>


    <main>

        <section class="welcome-card">

            <h2>
                Review your answers 👀
            </h2>

            <p>
                Make sure everything is correct
                before submitting your form.
            </p>

        </section>


        <!-- ANSWERS -->

        <section id="answersContainer">

            <p class="loading">
                Loading your answers... ⏳
            </p>

        </section>


        <!-- BUTTONS -->

        <div class="results-actions">

            <button
                type="button"
                id="previewButton"
                class="secondary-button"
            >
                👁 Preview
            </button>


            <button
                type="button"
                id="downloadButton"
                class="secondary-button"
            >
                ⬇ Download
            </button>


            <button
                type="button"
                id="submitButton"
                class="finish-button"
            >
                📤 Submit
            </button>

        </div>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to form
        </a>

    </main>


    <!-- ==================================
         PDF LIBRARY
    ================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


    <!-- ==================================
         SUPABASE
    ================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- ==================================
         SUPABASE CONFIG
    ================================== -->

    <script src="js/config.js"></script>


    <!-- ==================================
         RESULTS JAVASCRIPT
    ================================== -->

    <script src="js/results.js"></script>

</body>

</html>
